[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gasnetwork"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "jax",
    "scipy",
    "matplotlib",
    "networkx",
]

[tool.setuptools.packages.find]
include = ["gasnetwork*"]
